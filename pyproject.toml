[project]
name = "nerve-frequency-study"
version = "0.1.0"
description = "Periferik sinir stimülasyonunun frekansa bağlı beyin bölgesi yanıtları — multi-scale simülasyon (NEURON + Brian2)"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "brian2>=2.6",
    # neuron ayrıca kurulmalı — pip ile: pip install neuron
    # veya: uv pip install neuron
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ipykernel",
    "jupyter",
]

[tool.uv]
# uv ile sanal ortam yönetimi
package = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
